name: Partner dispatch Windows checks
on:
  push:
    branches: [partner-print-dispatch]
    paths: ['partner-dispatch/**', '.github/workflows/partner-dispatch-windows.yml']
concurrency:
  group: partner-dispatch-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install hash-locked offline runtime dependencies
        run: python -m pip install --no-cache-dir --no-index --find-links partner-dispatch/wheelhouse --require-hashes -r partner-dispatch/requirements.lock
      - name: Windows DPAPI and directory permissions
        run: python partner-dispatch/diagnostics.py
      - name: Queue, routing, deletion, test mode and 500 MiB archive
        env:
          TEST_LARGE_FILE: '1'
        run: python -m unittest discover -s partner-dispatch -p test_dispatch.py -v
      - name: Install pinned native build tools
        run: python -m pip install --no-cache-dir --require-hashes -r partner-dispatch/build-requirements.lock
      - name: Build native Windows application
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller-cache
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CloudshopPrint-${{ matrix.architecture }}
          --distpath native --workpath build/native --specpath .
          --add-data "partner-dispatch/ИНСТРУКЦИЯ.txt:."
          --add-data "partner-dispatch/ТЕСТ_НЕ_ПЕЧАТАТЬ_1х1см.tif:."
          partner-dispatch/app.py
      - name: Smoke-test the actual EXE without credentials or network
        env:
          BUILD_ARCH: ${{ matrix.architecture }}
        run: |
          $report = Join-Path $PWD "native/smoke-${{ matrix.architecture }}.json"
          $exe = (Resolve-Path "native/CloudshopPrint-${{ matrix.architecture }}.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test','--report',"`"$report`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw 'Native executable failed smoke test' }
          python -c "import json,os,pathlib; p=pathlib.Path(r'$report'); d=json.loads(p.read_text()); assert d['ok']; d.update(source_commit=os.environ['GITHUB_SHA'],architecture=os.environ['BUILD_ARCH']); p.write_text(json.dumps(d,indent=2),encoding='utf-8'); print(json.dumps(d))"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.architecture }}
          path: native/
          retention-days: 3
  package:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-parts
      - name: Assemble verified package
        run: python partner-dispatch/create_native_package.py --parts native-parts --output downloads --commit "$GITHUB_SHA"
      - name: Publish only generated package to the feature branch
        run: |
          git fetch origin partner-print-dispatch
          test "$(git rev-parse origin/partner-print-dispatch)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Cloudshop-Print-Windows-v0.3.zip downloads/Cloudshop-Print-Windows-v0.3.sha256
          git commit -m 'Build verified Windows executable package [skip ci]'
          git push origin HEAD:partner-print-dispatch
