name: Attendance Windows verification
on:
  push:
    paths:
      - 'attendance-windows/**'
      - 'tests/attendance-windows.ps1'
      - '.github/workflows/attendance-windows-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell scripts and boot detection
        shell: powershell
        run: ./tests/attendance-windows.ps1
